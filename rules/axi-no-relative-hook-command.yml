id: axi-no-relative-hook-command
language: TypeScript
severity: error
message: Store a resolved, quoted executable in hooks; bare or relative paths depend on agent cwd/PATH.
utils:
  hook-object:
    all:
      - kind: object
      - any:
          - has:
              pattern:
                context: '({ type: "command" })'
                selector: pair
          - has:
              kind: pair
              has:
                field: key
                regex: '^["\x27]?marker["\x27]?$'
          - inside:
              kind: variable_declarator
              has:
                field: name
                regex: '(hook|Hook)'
          - inside:
              kind: arguments
              inside:
                kind: call_expression
                has:
                  field: function
                  regex: '(hook|Hook)'
rule:
  any:
    - all:
        - kind: pair
        - has:
            field: key
            regex: '^["\x27]?command["\x27]?$'
        - has:
            field: value
            regex: '^["\x27`](\.{1,2}/|[a-z0-9-]+-axi(?:-ctx)?[ \x27"`])'
        - inside:
            matches: hook-object
    - all:
        - kind: variable_declarator
        - pattern:
            context: 'const $COMMAND = $VALUE;'
            selector: variable_declarator
        - has:
            field: value
            regex: '^["\x27`](\.{1,2}/|[a-z0-9-]+-axi(?:-ctx)?[ \x27"`])'
        - inside:
            stopBy: end
            kind: program
            has:
              stopBy: end
              all:
                - any:
                    - all:
                        - kind: pair
                        - has:
                            field: key
                            regex: '^["\x27]?command["\x27]?$'
                        - has:
                            field: value
                            pattern: $COMMAND
                    - pattern:
                        context: '({ $COMMAND })'
                        selector: shorthand_property_identifier
                - inside:
                    matches: hook-object
